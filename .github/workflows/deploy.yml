name: Build, test and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialise publication. The current-main-head check on the latest step stops
# a re-run of an older commit from moving latest backwards.
concurrency:
  group: main-image-publish
  cancel-in-progress: false

jobs:
  build-test-push:
    name: Build, test and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Test pull agent registry logic
        run: python3 deploy/test_pull_agent.py

      - name: Test production Compose validator
        run: python3 deploy/test_validate_compose.py

      - name: Test deployment policy invariants
        run: python3 deploy/test_deployment_policy.py

      - name: Validate production Compose file
        run: |
          IMAGE_TAG=validate \
          APP_IMAGE="$IMAGE" \
          ACME_EMAIL=ci@example.com \
            docker compose -f deploy/docker-compose.prod.yml config -q

      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -e ACME_EMAIL=ci@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Build test stage and run OCaml tests
        run: docker build --target test -t sim-map:test .

      - name: Build runtime image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:latest" .

      - name: Smoke test image and WAL persistence
        run: |
          PORT=$((18000 + RANDOM % 500))
          ./deploy/smoke-test.sh "$IMAGE:$GITHUB_SHA" "$PORT"

      - name: Smoke test WebSocket through Caddy
        run: |
          PORT=$((18500 + RANDOM % 300))
          ./deploy/caddy-smoke-test.sh "$IMAGE:$GITHUB_SHA" "$PORT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish immutable SHA tag
        run: docker push "$IMAGE:$GITHUB_SHA"

      # latest is only moved by a successful push to main, and only if this
      # run is still the current head of main. Manual workflow_dispatch runs
      # publish only their immutable SHA tag.
      - name: Publish latest (current main head only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Not publishing latest: main is $current, this build is $GITHUB_SHA"
            exit 0
          fi
          docker push "$IMAGE:latest"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true
