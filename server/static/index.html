<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chessboards</title>
  <link rel="icon" href="data:,">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b1b1b;
    }

    canvas#game {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;      /* let pointer events drive dragging and panning */
    }

    #coords {
      position: fixed;
      top: 10px;
      right: 12px;
      padding: 4px 8px;
      font: 13px ui-monospace, monospace;
      color: #f2f2f2;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 4px;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="coords">(0, 0)</div>
  <script src="/static/main.bc.wasm.js"></script>
</body>
</html>
