name: chess

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/ja927cam/ocaml-omcb}:${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s

    environment:
      OCAML_OMCB_DATA_DIR: /var/lib/sim-map/data
      OCAML_OMCB_PORT: "8080"
      OCAML_OMCB_INTERFACE: 0.0.0.0
      # Legacy names remain for the pre-rename deploy validator and for
      # rollback to an older image.
      SIM_MAP_DATA_DIR: /var/lib/sim-map/data
      SIM_MAP_PORT: "8080"
      SIM_MAP_INTERFACE: 0.0.0.0

      # Production defaults. Override any of these in /opt/ocaml-omcb/.env.
      # The SIM_MAP_* fallbacks and legacy data path keep existing
      # /opt/sim-map installs deployable during the rename.
      OCAML_OMCB_ADAPTIVE: "${OCAML_OMCB_ADAPTIVE:-${SIM_MAP_ADAPTIVE:-1}}"
      OCAML_OMCB_ADAPTIVE_MAX: "${OCAML_OMCB_ADAPTIVE_MAX:-${SIM_MAP_ADAPTIVE_MAX:-256}}"
      OCAML_OMCB_WAL_GROUP: "${OCAML_OMCB_WAL_GROUP:-${SIM_MAP_WAL_GROUP:-64}}"
      OCAML_OMCB_WAL_SYNC: "${OCAML_OMCB_WAL_SYNC:-${SIM_MAP_WAL_SYNC:-1}}"
      OCAML_OMCB_SNAPSHOT_MOVES: "${OCAML_OMCB_SNAPSHOT_MOVES:-${SIM_MAP_SNAPSHOT_MOVES:-100000}}"
      OCAML_OMCB_SNAPSHOT_SECONDS: "${OCAML_OMCB_SNAPSHOT_SECONDS:-${SIM_MAP_SNAPSHOT_SECONDS:-600}}"

      # Keep the world visibly alive around viewers. Off by default in the
      # server so test harnesses see pristine boards; production opts in here.
      OCAML_OMCB_SIMULATION: "${OCAML_OMCB_SIMULATION:-${SIM_MAP_SIMULATION:-1}}"
      OCAML_OMCB_SIM_INTERVAL_MS: "${OCAML_OMCB_SIM_INTERVAL_MS:-1000}"
      OCAML_OMCB_SIM_MAX: "${OCAML_OMCB_SIM_MAX:-8}"
      OCAML_OMCB_SIM_RADIUS: "${OCAML_OMCB_SIM_RADIUS:-1}"
      OCAML_OMCB_SIM_AMBIENT_MS: "${OCAML_OMCB_SIM_AMBIENT_MS:-2000}"

      CONNECTION_OUTBOX_CAPACITY: "${CONNECTION_OUTBOX_CAPACITY:-256}"
      EVENT_BATCHING: "${EVENT_BATCHING:-1}"
      EVENT_BATCH_WINDOW_MS: "${EVENT_BATCH_WINDOW_MS:-1}"

    volumes:
      - type: bind
        source: /srv/chess/data
        target: /var/lib/sim-map/data
        bind:
          create_host_path: false

    # Deliberately no ports: only Caddy publishes to the host.
    expose:
      - "8080"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    stop_grace_period: 30s

    ports:
      - "80:80"
      - "443:443"

    environment:
      ACME_EMAIL: "${ACME_EMAIL:-admin@jamesashwood.com}"

    volumes:
      # Bind the directory, not the file, so an atomic Caddyfile update on
      # the host is visible to the running container before `caddy reload`.
      - type: bind
        source: ./caddy
        target: /etc/caddy
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/chess/caddy/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /srv/chess/caddy/config
        target: /config
        bind:
          create_host_path: false

    depends_on:
      app:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
