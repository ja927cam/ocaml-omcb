services:
  ocaml-omcb:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocaml-omcb:local
    init: true
    ports:
      - "8080:8080"
    environment:
      OCAML_OMCB_DATA_DIR: /var/lib/ocaml-omcb/data
      OCAML_OMCB_PORT: "8080"
      OCAML_OMCB_INTERFACE: 0.0.0.0
      # Adaptive group commit is the production default. Uncomment to pin a
      # fixed policy instead:
      # OCAML_OMCB_ADAPTIVE: "0"
      # OCAML_OMCB_WAL_GROUP: "64"
    volumes:
      - ocaml-omcb-data:/var/lib/ocaml-omcb/data
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  ocaml-omcb-data:
