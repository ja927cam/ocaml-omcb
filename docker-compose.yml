services:
  sim-map:
    build:
      context: .
      dockerfile: Dockerfile
    image: sim-map:local
    init: true
    ports:
      - "8080:8080"
    environment:
      SIM_MAP_DATA_DIR: /var/lib/sim-map/data
      SIM_MAP_PORT: "8080"
      SIM_MAP_INTERFACE: 0.0.0.0
      # Adaptive group commit is the production default. Uncomment to pin a
      # fixed policy instead:
      # SIM_MAP_ADAPTIVE: "0"
      # SIM_MAP_WAL_GROUP: "64"
    volumes:
      - sim-map-data:/var/lib/sim-map/data
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  sim-map-data:
